entry: audience_joint_singleton_visible_bad
observation-model: constant-time
principals: [alice, bob]
adversaries:
  maximal:
  - [alice, bob]
hosts:
  compute:
    visibility: secret
  alice-endpoint:
    visibility:
      world: false
      members: [alice]
      joint: []
components:
  logits:
    lifecycle: entry-input
    type: bv32
    visibility: secret
outputs: {}
releases:
  joint-class:
    locator:
      helper: joint-class
      call-ordinal: 0
    audience:
      world: false
      members: []
      joint:
      - [alice, bob]
    type:
      kind: bv
      width: 32
      byte-order: little
    expression:
      bit-and:
        left: {component: logits}
        right: {constant: 255}
    guard: true
    payload-footprint: [0]
    multiplicity: 1

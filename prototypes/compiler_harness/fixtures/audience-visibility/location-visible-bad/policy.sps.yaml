entry: audience_location_visible_bad
observation-model: constant-time
principals: [alice, bob]
adversaries:
  maximal:
  - [alice, bob]
hosts:
  compute:
    visibility:
      world: false
      members: [bob]
      joint: []
components:
  secret:
    lifecycle: entry-input
    type: bv32
    visibility: secret
outputs: {}
releases:
  alice-class:
    locator:
      helper: alice-class
      call-ordinal: 0
    audience:
      world: false
      members: [alice]
      joint: []
    type:
      kind: bv
      width: 32
      byte-order: little
    expression:
      bit-and:
        left: {component: secret}
        right: {constant: 255}
    guard: true
    payload-footprint: [0]
    multiplicity: 1
